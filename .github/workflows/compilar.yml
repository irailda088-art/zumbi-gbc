name: Compilar Jogo Game Boy

on:
  push:
    branches: [ "main", "master", "principal" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    # Aqui mandamos o GitHub usar o sistema com o compilador já pronto
    container:
      image: giginet/gbdk:latest

    steps:
    - name: Pegar codigo do repositorio
      uses: actions/checkout@v4

    - name: Gerar o arquivo do jogo
      run: lcc main.c -o meujogo.gb

    - name: Preparar para Download
      uses: actions/upload-artifact@v4
      with:
        name: arquivo-do-lemoroid
        path: meujogo.gb
        
