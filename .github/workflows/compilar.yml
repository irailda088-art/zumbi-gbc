name: Compilar Jogo Game Boy

on:
  push:
    branches: [ "main", "master", "principal" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    # Usamos um ambiente que já possui o compilador configurado
    container:
      image: ghcr.io/gbdk-2020/gbdk-2020:latest

    steps:
    - name: Pegar codigo do repositorio
      uses: actions/checkout@v4

    - name: Gerar o arquivo do jogo
      run: lcc main.c -o meujogo.gb

    - name: Preparar para Download
      uses: actions/upload-artifact@v4
      with:
        name: arquivo-do-lemoroid
        path: meujogo.gb
        
