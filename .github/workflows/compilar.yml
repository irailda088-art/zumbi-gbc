name: Compilar Jogo Game Boy

on:
  push:
    branches: [ "main", "master", "principal" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Pegar codigo do repositorio
      uses: actions/checkout@v4

    - name: Instalar GBDK Oficial via Snap
      run: |
        sudo snap install gbdk --edge
        # Adiciona o compilador ao caminho do sistema
        echo "/snap/bin" >> $GITHUB_PATH

    - name: Gerar o arquivo do jogo
      run: gbdk.lcc main.c -o meujogo.gb

    - name: Preparar para Download
      uses: actions/upload-artifact@v4
      with:
        name: arquivo-do-lemoroid
        path: meujogo.gb
