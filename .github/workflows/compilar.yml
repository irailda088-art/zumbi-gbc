name: Compilar Jogo Game Boy

on:
  push:
    branches: [ "main", "master", "principal" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Pegar codigo do repositorio
      uses: actions/checkout@v4

    - name: Configurar GBDK 2020 Oficial
      uses: gbdk-2020/gh-action-gbdk@v1.1.0

    - name: Gerar o arquivo do jogo
      run: lcc main.c -o meujogo.gb

    - name: Preparar para Download
      uses: actions/upload-artifact@v4
      with:
        name: arquivo-do-lemoroid
        path: meujogo.gb
        
